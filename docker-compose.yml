services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinic_schedule
      POSTGRES_USER: clinic_schedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_schedule -d clinic_schedule"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://clinic_schedule:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/clinic_schedule?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      TZ: Asia/Omsk
      CLINIC_TIMEZONE: Asia/Omsk
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

volumes:
  clinic-postgres:
